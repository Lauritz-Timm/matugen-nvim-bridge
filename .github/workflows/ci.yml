name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  neovim:
    name: Neovim ${{ matrix.neovim }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            neovim: v0.10.4
          - os: ubuntu-latest
            neovim: stable
          - os: macos-latest
            neovim: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - run: make test

  matugen:
    name: Matugen 4.2 integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable
      - name: Install Matugen
        run: cargo install --locked --git https://github.com/InioX/matugen --tag v4.2.0
      - run: make test-matugen
