name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  neovim:
    name: Neovim ${{ matrix.neovim }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            neovim: v0.10.4
          - os: ubuntu-latest
            neovim: stable
          - os: macos-latest
            neovim: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - run: make test

  matugen:
    name: Matugen 4.2 integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable
      - name: Install Matugen
        shell: bash
        run: |
          matugen_archive="$RUNNER_TEMP/matugen.tar.gz"
          matugen_directory="$RUNNER_TEMP/matugen-bin"
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$matugen_archive" \
            https://github.com/InioX/matugen/releases/download/v4.2.0/matugen-4.2.0-x86_64.tar.gz
          printf '%s  %s\n' a2e3b50e49ed6439999ba3c252ed04fabd98ee4e9d12e5e5dff2e66370569751 "$matugen_archive" | sha256sum --check -
          mkdir -p "$matugen_directory"
          tar -xzf "$matugen_archive" -C "$matugen_directory"
          matugen_binary="$(find "$matugen_directory" -type f -name matugen -print -quit)"
          test -n "$matugen_binary"
          chmod +x "$matugen_binary"
          dirname "$matugen_binary" >> "$GITHUB_PATH"
      - run: make test-matugen
