<text x="563" y="88" fill="#555860" font-size="12" text-anchor="end">1</text>
<text x="581" y="88" font-size="14" xml:space="preserve"><tspan fill="#555860">-- Colors follow your wallpaper.</tspan></text>
<text x="563" y="111" fill="#555860" font-size="12" text-anchor="end">2</text>
<text x="581" y="111" font-size="14" xml:space="preserve"><tspan fill="#51408f">local </tspan><tspan fill="#191c20">palette </tspan><tspan fill="#555860">= {</tspan></text>
