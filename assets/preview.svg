<text x="563" y="157" fill="#555860" font-size="12" text-anchor="end">4</text>
<text x="581" y="157" font-size="14" xml:space="preserve"><tspan fill="#005c59">  contrast </tspan><tspan fill="#555860">= </tspan><tspan fill="#86310c">4.5</tspan><tspan fill="#555860">,</tspan></text>
<text x="563" y="180" fill="#555860" font-size="12" text-anchor="end">5</text>
<text x="581" y="180" font-size="14" xml:space="preserve"><tspan fill="#555860">}</tspan></text>
<text x="563" y="203" fill="#555860" font-size="12" text-anchor="end">6</text>
<text x="581" y="203" font-size="14" xml:space="preserve"></text>
<rect x="528" y="209" width="496" height="23" fill="#e7eaf4"/>
<text x="563" y="226" fill="#555860" font-size="12" text-anchor="end">7</text>
<text x="581" y="226" font-size="14" xml:space="preserve"><tspan fill="#51408f">local function </tspan><tspan fill="#00577a">apply_theme</tspan><tspan fill="#555860">(</tspan><tspan fill="#191c20">options</tspan><tspan fill="#555860">)</tspan></text>
<text x="563" y="249" fill="#555860" font-size="12" text-anchor="end">8</text>
<text x="581" y="249" font-size="14" xml:space="preserve"><tspan fill="#51408f">  if </tspan><tspan fill="#191c20">options</tspan><tspan fill="#555860">.</tspan><tspan fill="#005c59">enabled </tspan><tspan fill="#51408f">then</tspan></text>
<text x="563" y="272" fill="#555860" font-size="12" text-anchor="end">9</text>
<text x="581" y="272" font-size="14" xml:space="preserve"><tspan fill="#51408f">    return </tspan><tspan fill="#191c20">palette</tspan><tspan fill="#555860">.</tspan><tspan fill="#005c59">primary</tspan></text>
<text x="563" y="295" fill="#555860" font-size="12" text-anchor="end">10</text>
<text x="581" y="295" font-size="14" xml:space="preserve"><tspan fill="#51408f">  end</tspan></text>
<text x="563" y="318" fill="#555860" font-size="12" text-anchor="end">11</text>
