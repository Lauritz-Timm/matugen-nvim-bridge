<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" role="img" aria-labelledby="title description">
<title id="title">matugen-nvim-bridge dark and light palette preview</title>
<desc id="description">The same Lua example and syntax roles using palettes generated by Matugen from a blue seed.</desc>
<rect width="1040" height="440" rx="12" fill="#161a22"/>
<rect x="16" y="16" width="496" height="408" rx="8" fill="#111318"/>
<text x="40" y="50" fill="#e2e2e9" font-size="18" font-weight="600">Dark</text>
<text x="344" y="50" fill="#abc7ff" font-size="12">MATUGEN NVIM BRIDGE</text>
<text x="51" y="88" fill="#a4a7b0" font-size="12" text-anchor="end">1</text>
<text x="69" y="88" font-size="14" xml:space="preserve"><tspan fill="#a4a7b0">-- Colors follow your wallpaper.</tspan></text>
<text x="51" y="111" fill="#a4a7b0" font-size="12" text-anchor="end">2</text>
<text x="69" y="111" font-size="14" xml:space="preserve"><tspan fill="#b9aeff">local </tspan><tspan fill="#e2e2e9">palette </tspan><tspan fill="#a4a7b0">= {</tspan></text>
<text x="51" y="134" fill="#a4a7b0" font-size="12" text-anchor="end">3</text>
<text x="69" y="134" font-size="14" xml:space="preserve"><tspan fill="#45d3cb">  primary </tspan><tspan fill="#a4a7b0">= </tspan><tspan fill="#99cc7d">&quot;#4488ee&quot;</tspan><tspan fill="#a4a7b0">,</tspan></text>
<text x="51" y="157" fill="#a4a7b0" font-size="12" text-anchor="end">4</text>
<text x="69" y="157" font-size="14" xml:space="preserve"><tspan fill="#45d3cb">  contrast </tspan><tspan fill="#a4a7b0">= </tspan><tspan fill="#fca07f">4.5</tspan><tspan fill="#a4a7b0">,</tspan></text>
<text x="51" y="180" fill="#a4a7b0" font-size="12" text-anchor="end">5</text>
<text x="69" y="180" font-size="14" xml:space="preserve"><tspan fill="#a4a7b0">}</tspan></text>
<text x="51" y="203" fill="#a4a7b0" font-size="12" text-anchor="end">6</text>
<text x="69" y="203" font-size="14" xml:space="preserve"></text>
<rect x="16" y="209" width="496" height="23" fill="#20252f"/>
<text x="51" y="226" fill="#a4a7b0" font-size="12" text-anchor="end">7</text>
<text x="69" y="226" font-size="14" xml:space="preserve"><tspan fill="#b9aeff">local function </tspan><tspan fill="#65c6fc">apply_theme</tspan><tspan fill="#a4a7b0">(</tspan><tspan fill="#e2e2e9">options</tspan><tspan fill="#a4a7b0">)</tspan></text>
<text x="51" y="249" fill="#a4a7b0" font-size="12" text-anchor="end">8</text>
<text x="69" y="249" font-size="14" xml:space="preserve"><tspan fill="#b9aeff">  if </tspan><tspan fill="#e2e2e9">options</tspan><tspan fill="#a4a7b0">.</tspan><tspan fill="#45d3cb">enabled </tspan><tspan fill="#b9aeff">then</tspan></text>
<text x="51" y="272" fill="#a4a7b0" font-size="12" text-anchor="end">9</text>
<text x="69" y="272" font-size="14" xml:space="preserve"><tspan fill="#b9aeff">    return </tspan><tspan fill="#e2e2e9">palette</tspan><tspan fill="#a4a7b0">.</tspan><tspan fill="#45d3cb">primary</tspan></text>
<text x="51" y="295" fill="#a4a7b0" font-size="12" text-anchor="end">10</text>
<text x="69" y="295" font-size="14" xml:space="preserve"><tspan fill="#b9aeff">  end</tspan></text>
<text x="51" y="318" fill="#a4a7b0" font-size="12" text-anchor="end">11</text>
<text x="69" y="318" font-size="14" xml:space="preserve"><tspan fill="#b9aeff">end</tspan></text>
